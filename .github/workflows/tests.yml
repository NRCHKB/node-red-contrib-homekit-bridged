name: Tests

env:
  HUSKY: 0

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [ 22, 24, 26 ]
        os: [ ubuntu-latest, windows-latest, macOS-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: build and test
        run: |
          npm ci
          npm run lint
          npm run build
          npm run test:ci
        env:
          CI: true
