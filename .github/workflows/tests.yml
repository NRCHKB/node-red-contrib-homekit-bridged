name: Tests

env:
    HUSKY: 0

on:
    push:
    pull_request:

jobs:
    build:
        timeout-minutes: 20
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                node-version: [ 22, 24, 26 ]
                os: [ ubuntu-latest, windows-latest, macOS-latest ]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
            - name: Verify Node.js environment
              env:
                  EXPECTED_NODE_MAJOR: ${{ matrix.node-version }}
              run: |
                  node --version
                  npm --version
                  node -e "require('node:assert/strict').equal(process.versions.node.split('.')[0], process.env.EXPECTED_NODE_MAJOR)"
            - name: build and test
              run: |
                  npm ci
                  npm run lint
                  npm run typecheck
                  npm run build
                  npm run test:ci
              env:
                  CI: true
            - name: Coverage baseline
              if: matrix.os == 'ubuntu-latest' && matrix.node-version == 24
              run: npm run test:coverage
            - name: Targeted mutations
              if: matrix.os == 'ubuntu-latest' && matrix.node-version == 24
              run: npm run test:mutation
            - name: Packaged install smoke test
              if: matrix.os == 'ubuntu-latest' && matrix.node-version == 24
              run: npm run test:package
            - uses: actions/upload-artifact@v4
              if: always() && matrix.os == 'ubuntu-latest' && matrix.node-version == 24
              with:
                  name: coverage
                  path: coverage/
