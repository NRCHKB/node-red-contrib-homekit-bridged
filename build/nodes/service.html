<script data-help-name="homekit-service" type="text/markdown">
# HomeKit Service

Represents one legacy HomeKit service. It receives Node-RED messages to update HomeKit characteristics and emits messages when HomeKit changes those characteristics.

> [!WARNING]
> `homekit-service` is deprecated and kept for existing flows. Use `homekit-service2` for new work.

> [!IMPORTANT]
> The migration button prepares an editor-side change. Click **Done** and then **Deploy** to commit the migration.

## Message Format

Send a `msg.payload` object whose keys are HomeKit characteristic names.

```json
{
  "On": true,
  "OutletInUse": true
}
```

## Placement

- **Host Type**: Publish a parent service behind a shared **Bridge** or behind a standalone **Accessory**.
- **Bridge**: HomeKit bridge configuration that hosts this service.
- **Accessory**: Standalone accessory configuration that hosts this service.
- **Parent Service**: Parent service used by linked services.

## Advanced Behavior

> [!CAUTION]
> **Wait for Setup message** delays service setup until the node receives the required setup payload. The service will not be published until that message arrives.

- **Characteristic Properties**: JSON object that overrides HAP characteristic metadata such as `minValue`, `maxValue`, or `minStep`.
- **Camera Configuration**: Shown for camera services and describes FFmpeg streaming and snapshot settings.
</script>

<script type="text/javascript">
    RED.nodes.registerType('homekit-service', {
        category: "Apple HomeKit",
        paletteLabel: 'service',
        nrchkbPreventNewInstances: true,
        defaults: {
            isParent: {
                value: 'false',
                required: true,
            },
            hostType: {
                // 0 is Bridge, 1 is Accessory
                value: 0,
                required: true,
            },
            bridge: {
                value: '',
                type: 'homekit-bridge',
                validate: function (value) {
                    if (this.isParent == true && this.hostType == 0) {
                        return isValueDefined(value) && value.length > 0
                    } else return true
                },
            },
            accessoryId: {
                value: '',
                type: 'homekit-standalone',
                validate: function (value) {
                    if (this.isParent == true && this.hostType == 1) {
                        return isValueDefined(value) && value.length > 0
                    } else return true
                },
            },
            parentService: {
                value: '',
                validate: function (value) {
                    if (this.isParent == false) {
                        return isValueDefined(value) && value.length > 0
                    } else return true
                },
            },
            name: {
                value: '',
                required: true,
                validate: function (value) {
                    return isValueDefined(value) && value.length > 0
                },
            },
            serviceName: {
                value: '',
                required: true,
            },
            topic: {
                value: '',
            },
            filter: {
                value: false,
            },
            logLevel: {
                value: 'inherit',
                required: false,
            },
            manufacturer: {
                value: 'NRCHKB',
                required: true,
            },
            model: {
                value: nrchkbVersion,
                required: true,
            },
            serialNo: {
                value: 'Default Serial Number',
                required: true,
            },
            firmwareRev: {
                value: nrchkbVersion,
                required: false,
                validate: versionValidator,
            },
            hardwareRev: {
                value: nrchkbVersion,
                required: false,
                validate: versionValidator,
            },
            softwareRev: {
                value: nrchkbVersion,
                required: false,
                validate: versionValidator,
            },
            cameraConfigVideoProcessor: {
                value: 'ffmpeg',
                validate: cameraConfigRequiredField,
            },
            cameraConfigSource: {
                validate: cameraConfigRequiredField,
            },
            cameraConfigStillImageSource: {
                required: false,
            },
            cameraConfigMaxStreams: {
                value: 2,
                validate: cameraConfigRequiredField,
            },
            cameraConfigMaxWidth: {
                value: 1280,
                validate: cameraConfigRequiredField,
            },
            cameraConfigMaxHeight: {
                value: 720,
                validate: cameraConfigRequiredField,
            },
            cameraConfigMaxFPS: {
                value: 10,
                validate: cameraConfigRequiredField,
            },
            cameraConfigMaxBitrate: {
                value: 300,
                validate: cameraConfigRequiredField,
            },
            cameraConfigVideoCodec: {
                value: 'libx264',
                validate: cameraConfigRequiredField,
            },
            cameraConfigAudioCodec: {
                value: 'libfdk_aac',
                validate: cameraConfigRequiredField,
            },
            cameraConfigAudio: {
                value: false,
            },
            cameraConfigPacketSize: {
                value: 1316,
                validate: cameraConfigRequiredField,
            },
            cameraConfigVerticalFlip: {
                value: false,
            },
            cameraConfigHorizontalFlip: {
                value: false,
            },
            cameraConfigMapVideo: {
                value: '0:0',
                validate: cameraConfigRequiredField,
            },
            cameraConfigMapAudio: {
                value: '0:1',
                validate: cameraConfigRequiredField,
            },
            cameraConfigVideoFilter: {
                value: 'scale=1280:720',
            },
            cameraConfigAdditionalCommandLine: {
                value: '-tune zerolatency',
            },
            cameraConfigDebug: {
                value: false,
            },
            cameraConfigSnapshotOutput: {
                value: 'disabled',
                validate: cameraConfigRequiredField,
            },
            cameraConfigInterfaceName: {
                value: '',
            },
            characteristicProperties: {
                value: '{}',
                validate: function (value) {
                    if (value === undefined || value.length === 0) {
                        return true
                    }

                    try {
                        JSON.parse(value)
                    } catch (_) {
                        return false
                    }

                    return true
                },
            },
            waitForSetupMsg: {
                value: false
            },
            outputs: {
                value: 2,
            },
            adaptiveLightingOptionsEnable: {
                value: false,
            },
            adaptiveLightingOptionsMode: {
                validate: RED.validators.number(true)
            },
            adaptiveLightingOptionsCustomTemperatureAdjustment: {
                validate: RED.validators.number(true)
            },
        },
        inputs: 1,
        outputs: 2,
        outputLabels: function (index) {
            if (index === 0) {
                return 'onChange'
            }

            if (index === 1) {
                return 'onSet'
            }

            if (index === 2) {
                return 'camera snapshot'
            }

            return ''
        },
        icon: 'homekit.png',
        color: '#fcc127',
        label: function () {
            return this.name || this.serviceName || 'Service'
        },
        labelStyle: function () {
            return this.name ? 'node_label_italic' : ''
        },
        onadd: function () {
            applyDefaultNodeDocumentation(this, 'homekit-service')
        },
        oneditprepare: function () {
            let node = this
            appendNRCHKBLogLevelRow(
                '#node-input-logLevel-container',
                'node-input-logLevel',
                node.logLevel,
            )

            let isParentToggle = $('#node-config-input-isParent')
            const prefersReducedMotion = function () {
                return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
            }
            const showEditorSection = function (section) {
                if (prefersReducedMotion()) {
                    section.stop(true, true).show()
                    return
                }

                section.stop(true, true).fadeIn('fast')
            }
            const hideEditorSection = function (section) {
                if (prefersReducedMotion()) {
                    section.stop(true, true).hide()
                    return
                }

                section.stop(true, true).fadeOut('fast')
            }

            if (node.isParent === false) {
                isParentToggle.val('false')
            } else {
                isParentToggle.val('true')
            }

            const toSerializableValue = function (value) {
                if (value === undefined || value === null) {
                    return value
                }

                if (typeof value !== 'object') {
                    return value
                }

                try {
                    return JSON.parse(JSON.stringify(value))
                } catch (_) {
                    return undefined
                }
            }

            const readCurrentNodeConfig = function () {
                const config = {
                    id: node.id,
                    type: node.type,
                    z: node.z,
                    g: node.g,
                    wires: toSerializableValue(node.wires),
                    outputs: node.outputs
                }

                Object.keys((node._def && node._def.defaults) || {}).forEach(function (key) {
                    const value = toSerializableValue(node[key])

                    if (value !== undefined) {
                        config[key] = value
                    }
                })

                return $.extend(config, {
                    name: $('#node-input-name').val(),
                    serviceName:
                        $('#node-input-serviceName').val() ||
                        $('#node-input-serviceName option:selected').attr('value') ||
                        node.serviceName,
                    manufacturer: $('#node-input-manufacturer').val(),
                    model: $('#node-input-model').val(),
                    serialNo: $('#node-input-serialNo').val(),
                    firmwareRev: $('#node-input-firmwareRev').val(),
                    cameraConfigVideoProcessor: $('#node-input-cameraConfigVideoProcessor').val(),
                    cameraConfigSource: $('#node-input-cameraConfigSource').val(),
                    cameraConfigStillImageSource: $('#node-input-cameraConfigStillImageSource').val(),
                    cameraConfigMaxStreams: $('#node-input-cameraConfigMaxStreams').val(),
                    cameraConfigMaxWidth: $('#node-input-cameraConfigMaxWidth').val(),
                    cameraConfigMaxHeight: $('#node-input-cameraConfigMaxHeight').val(),
                    cameraConfigMaxFPS: $('#node-input-cameraConfigMaxFPS').val(),
                    cameraConfigMaxBitrate: $('#node-input-cameraConfigMaxBitrate').val(),
                    cameraConfigVideoCodec: $('#node-input-cameraConfigVideoCodec').val(),
                    cameraConfigAudio: $('#node-input-cameraConfigAudio').is(':checked'),
                    cameraConfigPacketSize: $('#node-input-cameraConfigPacketSize').val(),
                    cameraConfigMapVideo: $('#node-input-cameraConfigMapVideo').val(),
                    cameraConfigMapAudio: $('#node-input-cameraConfigMapAudio').val(),
                    cameraConfigVideoFilter: $('#node-input-cameraConfigVideoFilter').val(),
                    cameraConfigAdditionalCommandLine: $('#node-input-cameraConfigAdditionalCommandLine').val(),
                    cameraConfigDebug: $('#node-input-cameraConfigDebug').is(':checked')
                })
            }

            const showMigrationPrepared = function (result) {
                if (
                    result.node.serviceName &&
                    $('#node-input-serviceName option[value="' + result.node.serviceName + '"]').length === 0
                ) {
                    $('#node-input-serviceName').append(
                        $('<option></option>')
                            .val(result.node.serviceName)
                            .text(result.node.serviceName)
                    )
                }

                if (result.node.serviceName) {
                    $('#node-input-serviceName')
                        .val(result.node.serviceName)
                        .trigger('change')
                }

                $('#nrchkb-migration-result')
                    .html(
                        '<strong>Migration prepared.</strong> Service is now <code>' +
                        $('<div>').text(result.node.serviceName || '').html() +
                        '</code>. Click <strong>Done</strong> to commit this editor change, then <strong>Deploy</strong>.'
                    )
                    .show()
            }

            $('#nrchkb-migrate-service2').on('click', function () {
                $('<div>')
                    .html('<p>This will prepare this node for conversion to <strong>homekit-service2</strong> in legacy output mode and preserve existing wires.</p><p>CameraControl nodes will become the new <strong>Camera</strong> service with the embedded Homebridge Camera FFmpeg plugin.</p><p>After migration is prepared, click <strong>Done</strong> in this node editor to commit the change, then <strong>Deploy</strong>.</p>')
                    .dialog({
                        modal: true,
                        resizable: false,
                        width: 420,
                        title: 'Migrate Service Node',
                        buttons: {
                            Migrate: function () {
                                const dialog = this

                                $.ajax({
                                    url: 'nrchkb/migration/node',
                                    type: 'POST',
                                    contentType: 'application/json',
                                    data: JSON.stringify(readCurrentNodeConfig())
                                }).done(function (result) {
                                    if (!result || !result.migrated || !result.node) {
                                        RED.notify('This node could not be migrated.', 'warning')
                                        return
                                    }

                                    node._nrchkbPendingMigration = result.node
                                    showMigrationPrepared(result)

                                    RED.nodes.dirty(true)

                                    if (RED.view && RED.view.redraw) {
                                        RED.view.redraw(true)
                                    }

                                    RED.notify(
                                        result.cameraMigrated
                                            ? 'Migration prepared: CameraControl will become homekit-service2 Camera. Click Done, then Deploy.'
                                            : 'Migration prepared. Click Done, then Deploy.',
                                        'success'
                                    )

                                    $(dialog).dialog('destroy')
                                    $('.ui-dialog-content').dialog('close')
                                }).fail(function (xhr) {
                                    const message = xhr.responseJSON && xhr.responseJSON.error
                                        ? xhr.responseJSON.error
                                        : 'Migration failed.'
                                    RED.notify(message, 'error')
                                })
                            },
                            Cancel: function () {
                                $(this).dialog('destroy')
                            },
                        },
                    })
            })

            let isLinkedDiv = $('#isLinked')
            let isParentDiv = $('#isParent')

            const selectHostType = $('#node-config-input-hostType')

            isParentToggle
                .change(function () {
                    if (isParentToggle.val() === 'true') {
                        hideEditorSection(isLinkedDiv)
                        showEditorSection(isParentDiv)
                    } else {
                        hideEditorSection(isParentDiv)
                        showEditorSection(isLinkedDiv)
                        selectHostType.val("_ADD_")
                    }
                })
                .change()

            if (node.hostType) {
                selectHostType.val(node.hostType)
            } else {
                // Make sure that host type is selected when upgrading nrchkb
                selectHostType.val(0)
            }

            let isOnBridgeDiv = $('#isOnBridge')
            let isBridgeInSubflow = $('#isBridgeInSubflow')
            let isAccessoryDiv = $('#isAccessory')

            const inSubflow = !!RED.nodes.subflow(node.z)

            selectHostType
                .change(function () {
                    if (selectHostType.val() == 0) {
                        isAccessoryDiv.hide()
                        isOnBridgeDiv.show()

                        if (inSubflow) {
                            isBridgeInSubflow.show()
                        } else {
                            isBridgeInSubflow.hide()
                        }

                        $("#node-input-accessoryId").val("_ADD_");
                    } else {
                        isOnBridgeDiv.hide()
                        isAccessoryDiv.show()
                        $("#node-input-bridge").val("_ADD_");
                    }
                })
                .change()

            const selectServiceName = $('#node-input-serviceName')

            Object.keys(serviceTypes).sort().forEach(function (key) {
                const serviceOption = $('<option></option>')

                serviceOption
                    .val(key)
                    .text(key)

                if (serviceTypes[key].hasOwnProperty('nrchkbDisabledText')) {
                    serviceOption.text(serviceTypes[key].nrchkbDisabledText)
                    serviceOption.attr('disabled', 'disabled');
                }

                selectServiceName.append(serviceOption)
            })

            let cameraConfiguration = $('#camera-configuration')
            let adaptiveLightningConfiguration = $('#adaptive-lightning-configuration')

            selectServiceName
                .find('option')
                .filter(function () {
                    return $(this).val() === node.serviceName
                })
                .attr('selected', true)

            selectServiceName
                .change(function () {
                    if (this.value === 'CameraControl') {
                        cameraConfiguration.prop('open', true)
                        showEditorSection(cameraConfiguration)
                        node.outputs = 3
                    } else {
                        hideEditorSection(cameraConfiguration)
                        node.outputs = 2
                    }
                })
                .change()

            selectServiceName
                .change(function () {
                    if (this.value === 'Lightbulb') {
                        adaptiveLightningConfiguration.prop('open', true)
                        showEditorSection(adaptiveLightningConfiguration)
                    } else {
                        hideEditorSection(adaptiveLightningConfiguration)
                    }
                })
                .change()

            $('#node-input-characteristicProperties').typedInput({
                type: 'json',
                types: ['json'],
            })

            const selectParentService = $('#node-input-parentService')

            const candidateNodes = [
                ...RED.nodes.filterNodes({
                    type: 'homekit-service',
                }),
                ...RED.nodes.filterNodes({
                    type: 'homekit-service2',
                })
            ]

            const parentServiceOptions = []

            candidateNodes.forEach(function (n) {
                if (!n.name || n.name.length < 1 || !n.isParent) {
                    return
                }

                if (n.id === node.id) {
                    return
                }

                if (inSubflow) {
                    if (n.z !== node.z) {
                        return
                    }
                } else {
                    if (!!RED.nodes.subflow(n.z)) {
                        return
                    }
                }

                let sublabel
                let tab = RED.nodes.workspace(n.z)
                if (tab) {
                    sublabel = tab.label || tab.id
                } else {
                    tab = RED.nodes.subflow(n.z)
                    sublabel = 'subflow : ' + tab.name
                }

                const value = n.id
                const text = n.name + ' (' + sublabel + ')'
                const hostType = n.hostType

                parentServiceOptions.push({
                    text,
                    element: $('<option></option>')
                        .val(value)
                        .text(text)
                        .attr("hostType", hostType)
                })
            })

            sortSelectOptionsByLabel(selectParentService, parentServiceOptions)

            selectParentService
                .find('option')
                .filter(function () {
                    return $(this).val() === node.parentService
                })
                .attr('selected', true)

            selectParentService.change()

            $("#node-input-accessoryId option[value='${n.accessoryId}']").attr("disabled", false);

            candidateNodes.forEach(function (n) {
                if (n.id == node.id) {
                    return
                }

                if (n.hostType == 0) {
                    return
                }

                if (n.accessoryId) {
                    if (n.accessoryId == node.accessoryId) {
                        // Same accessory cannot be used twice!
                        $("#node-input-accessoryId").val("_ADD_");
                    }

                    const accessoryOption = $("#node-input-accessoryId option[value='" + n.accessoryId + "']");
                    accessoryOption.attr("disabled", true);
                    accessoryOption.text(accessoryOption.text() + " already used by " + n.name)
                }
            })

            isBridgeInSubflow.find('#bridgeInSubflowNotice').on("click", function () {
                $('<div>')
                    .css({maxHeight: '80%'})
                    .html("<ul>" +
                        "<li>If a Bridge is created within the Flow, then each Service node in a Subflow will be added to the existing (single) Bridge.</li>" +
                        "<li>If a Bridge is created within the Subflow, a new Bridge will be created for each Subflow instance.</li>" +
                        "<li>If a Standalone Accessory is being used, it is recommended to set it up completly within the Subflow editor. This will add a new Standalone Accessory for each Subflow instance in your Flow.</li>" +
                        "<li>Visit our <b><a href=\"https://nrchkb.github.io/wiki/introduction/service-node/#bridge\">wiki</a></b> for more informations.</li>" +
                        "</ul>")
                    .dialog({
                        draggable: true,
                        modal: true,
                        resizable: false,
                        width: 'auto',
                        title: 'Important Notice',
                        minHeight: 75,
                        buttons: {
                            Close: function () {
                                $(this).dialog('destroy')
                            }
                        }
                    })
            })
        },
        oneditcancel: function () {
            delete this._nrchkbPendingMigration
        },
        oneditsave: function () {
            let node = this

            if (node._nrchkbPendingMigration) {
                const migratedNode = node._nrchkbPendingMigration

                Object.keys(migratedNode).forEach(function (key) {
                    node[key] = migratedNode[key]
                })

                if (RED.nodes.getType(migratedNode.type)) {
                    node._def = RED.nodes.getType(migratedNode.type)
                }

                delete node._nrchkbPendingMigration
                return true
            }

            node.isParent = $('#node-config-input-isParent').val() === 'true'
            node.hostType = $('#node-config-input-hostType').val()


            if (!node.isParent) {
                const selectedParentService = $('#node-input-parentService option:selected')
                node.parentService = selectedParentService.val()
                node.hostType = selectedParentService.attr("hostType")
                node.bridge = ''
                node.accessoryId = ''
                $('#node-input-bridge').val('')
                $('#node-input-accessoryId').val('')
            } else if (node.hostType === '0') {
                node.accessoryId = ''
                node.parentService = ''
                $('#node-input-accessoryId').val('')
                $('#node-input-parentService').val('')
            } else if (node.hostType === '1') {
                node.bridge = ''
                node.parentService = ''
                $('#node-input-bridge').val('')
                $('#node-input-parentService').val('')
            }

            node.serviceName = $(
                '#node-input-serviceName option:selected',
            ).val()
        },
    })

    ;(function () {
        const legacyServiceType = 'homekit-service'
        const registry = RED.nodes.registry
        const legacyServiceDefinition = RED.nodes.getType(legacyServiceType)

        if (legacyServiceDefinition) {
            legacyServiceDefinition.nrchkbPreventNewInstances = true
        }

        if (registry && !registry._nrchkbPreventNewInstancesPatch) {
            const originalGetNodeTypes = registry.getNodeTypes

            registry.getNodeTypes = function () {
                return originalGetNodeTypes.call(registry).filter(function (type) {
                    const definition = RED.nodes.getType(type)
                    return !definition || definition.nrchkbPreventNewInstances !== true
                })
            }

            registry._nrchkbPreventNewInstancesPatch = true
        }

        const removeLegacyPaletteNode = function () {
            $('.red-ui-palette-node[data-palette-type="' + legacyServiceType + '"]').remove()
        }

        if (registry && RED.events && RED.events.on && !registry._nrchkbLegacyServicePaletteHandler) {
            RED.events.on('registry:node-type-added', function (type) {
                if (type === legacyServiceType) {
                    removeLegacyPaletteNode()
                }
            })
            registry._nrchkbLegacyServicePaletteHandler = true
        }

        removeLegacyPaletteNode()
        setTimeout(removeLegacyPaletteNode, 0)
    })()
</script>
