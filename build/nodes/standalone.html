                </div>
                <div class="form-row">
                    <label for="node-config-input-model"><i class="fa fa-cube"></i> <span data-i18n="standalone.common.model">Model</span></label>
                    <input type="text" id="node-config-input-model" placeholder="Model" data-i18n="[placeholder]standalone.common.model">
                </div>
                <div class="form-row">
                    <label for="node-config-input-firmwareRev"><i class="fa fa-microchip"></i> <span data-i18n="standalone.common.firmwareRevision">Firmware Revision</span></label>
                    <input type="text" id="node-config-input-firmwareRev" placeholder="Firmware Revision" data-i18n="[placeholder]standalone.common.firmwareRevision">
                </div>
                <div class="form-row">
                    <label for="node-config-input-hardwareRev"><i class="fa fa-hdd-o"></i> <span data-i18n="standalone.common.hardwareRevision">Hardware Revision</span></label>
                    <input type="text" id="node-config-input-hardwareRev" placeholder="Hardware Revision" data-i18n="[placeholder]standalone.common.hardwareRevision">
                </div>
                <div class="form-row">
                    <label for="node-config-input-softwareRev"><i class="fa fa-code"></i> <span data-i18n="standalone.common.softwareRevision">Software Revision</span></label>

        <details class="nrchkb-section">
            <summary><i class="fa fa-exchange"></i> <span data-i18n="standalone.common.messageHandling">Message Handling</span></summary>
            <div class="nrchkb-section-body">
                <div class="form-row nrchkb-checkbox-row">
                    <label class="nrchkb-checkbox-label" for="node-config-input-allowMessagePassthrough">
                        <input type="checkbox" id="node-config-input-allowMessagePassthrough">
                        <span><i class="fa fa-share"></i> <span data-i18n="standalone.common.allowMessagePassthrough">Allow Message Passthrough</span></span>
                    </label>

                <div id="node-config-input-logLevel-container"></div>
            </div>

        <details class="nrchkb-section">
            <summary><i class="fa fa-exclamation-triangle"></i> <span data-i18n="standalone.common.deprecatedMdns">Deprecated mDNS</span></summary>
            <div class="nrchkb-section-body">
                <div class="form-row nrchkb-checkbox-row">
                    <label class="nrchkb-checkbox-label" for="node-config-input-customMdnsConfig">
                        <input type="checkbox" id="node-config-input-customMdnsConfig">
                        <span><i class="fa fa-exclamation-triangle"></i> <span data-i18n="standalone.common.customMdnsConfigDeprecated">Custom MDNS Configuration (DEPRECATED, use Bind)</span></span>
                    </label>
                </div>
                <div id="mdns-configuration" class="nrchkb-nested-panel" style="display: none;">
                    <div class="form-row nrchkb-checkbox-row">
                        <label class="nrchkb-checkbox-label" for="node-config-input-mdnsMulticast">
                            <input type="checkbox" id="node-config-input-mdnsMulticast" checked>
                            <span><i class="fa fa-share-alt"></i> <span data-i18n="standalone.common.multicast">Multicast</span></span>

                        <label for="node-config-input-mdnsInterface"><i class="fa fa-sitemap"></i> <span data-i18n="standalone.common.multicastInterfaceIp">Multicast Interface IP</span></label>
                        <input type="text" id="node-config-input-mdnsInterface" placeholder="">
                    </div>
                    <div class="form-row">
                        <label for="node-config-input-mdnsPort"><i class="fa fa-plug"></i> <span data-i18n="standalone.common.port">Port</span></label>
                        <input type="text" id="node-config-input-mdnsPort" placeholder="">
                    </div>
                    <div class="form-row">
                        <label for="node-config-input-mdnsIp"><i class="fa fa-map-marker"></i> <span data-i18n="standalone.common.multicastAddressIp">Multicast Address IP</span></label>
                        <input type="text" id="node-config-input-mdnsIp" placeholder="">
                    </div>
                    <div class="form-row">
                        <label for="node-config-input-mdnsTtl"><i class="fa fa-clock-o"></i> <span data-i18n="standalone.common.ttl">TTL</span></label>
                        <input type="text" id="node-config-input-mdnsTtl" placeholder="255">
                    </div>
                    <div class="form-row nrchkb-checkbox-row">
                        <label class="nrchkb-checkbox-label" for="node-config-input-mdnsLoopback">
                            <input type="checkbox" id="node-config-input-mdnsLoopback" checked>
                            <span><i class="fa fa-refresh"></i> <span data-i18n="standalone.common.loopback">Loopback</span></span>
                        </label>
                    </div>
                    <div class="form-row nrchkb-checkbox-row">
                        <label class="nrchkb-checkbox-label" for="node-config-input-mdnsReuseAddr">
                            <input type="checkbox" id="node-config-input-mdnsReuseAddr" checked>
                            <span><i class="fa fa-recycle"></i> <span data-i18n="standalone.common.reuseAddress">Reuse Address</span></span>
                        </label>
                    </div>
                </div>
            </div>
        </details>
    </div>
</script>
<script data-help-name="homekit-standalone" type="text/markdown">
# Standalone HomeKit Accessory

Defines a HomeKit accessory that is paired directly in the Apple Home app. Use it when a service must be published as its own accessory instead of behind a shared bridge.

> [!IMPORTANT]
> Use a stable accessory name, category, PIN, serial number, and model. Changing identity fields can make HomeKit treat the accessory as a different device.

> [!WARNING]
> **Allow Insecure Request** permits unencrypted HomeKit requests. Leave it disabled unless a deliberate test client requires it.

## Pairing

- **Name**: Accessory name shown during pairing. HomeKit names can be up to 64 characters and must not contain a period.
- **Accessory Category**: Category HomeKit uses for the accessory icon and grouping. Defaults to `OTHER`.
- **Pin Code**: HomeKit setup code used when pairing this accessory.
- **Pairing QR Code**: Shows after the accessory is deployed and only while it is not paired.

## Network & Advertising

- **Port**: Optional HAP server port. Leave blank to auto-assign. Do not use `1880`, which is reserved for Node-RED.
- **Advertiser**: Selects the mDNS/DNS-SD backend used to announce this accessory to HomeKit.
- **Bind**: Restricts the network interfaces or IP addresses used by the HAP server and mDNS advertisement.
- **Log Level**: Controls logging for this standalone accessory unless a service overrides it. `Inherit` keeps the global logger and `DEBUG` behavior.

<p class="nrchkb-advertiser-dynamic">Recommendation unavailable.</p>

> [!NOTE]
> If HomeKit discovery is unreliable, also check Docker networking, VLAN mDNS reflection, Wi-Fi isolation, VPN or container interfaces, duplicate accessory identifiers, and other mDNS responders using UDP 5353.

## Deprecated mDNS

> [!CAUTION]
> **Custom MDNS Configuration** is kept only so older flows can still open in the editor. It is ignored by the current runtime. Use **Bind** and **Advertiser** for active network configuration.
</script>
<script type="text/javascript">
    RED.nodes.registerType('homekit-standalone', {
        category: 'config',
        defaults: {
            accessoryCategory: {
                value: 'OTHER',
                required: true
            },
            bridgeName: {
                value: '',
                required: true,
                validate: hostNameValidator,
            },
            hostType: {
                value: 1,
                required: true,
            },
            pinCode: {
                required: true,
                validate: validatePinCode,
            },
            port: {
                required: false,
                validate: function (value) {
                    if (value) return RED.validators.port(value)
                    else return true
                },
            },
            advertiser: {
                value: 'bonjour-hap',
                required: false,
                validate: function (value) {
                    if (value) return value === 'bonjour-hap' || value === 'ciao' || value === 'avahi' || value === 'resolved'
                    else return true
                },
            },
            allowInsecureRequest: {
                value: false,
                required: true,
            },
            manufacturer: {
                value: 'NRCHKB',
                required: true,
            },
            model: {
                value: nrchkbVersion,
                required: true,
            },
            serialNo: {
                value: 'Default Serial Number',
                required: true,
            },
            firmwareRev: {
                value: nrchkbVersion,
                required: false,
                validate: versionValidator,
            },
            hardwareRev: {
                value: nrchkbVersion,
                required: false,
                validate: versionValidator,
            },
            softwareRev: {
                value: nrchkbVersion,
                required: false,
                validate: versionValidator,
            },
            bind: {
                value: undefined,
                required: false,
            },
            bindType: {
                value: undefined,
                required: false,
            },
            customMdnsConfig: {
                value: false,
                required: false,
                validate: (value) => !value
            },
            mdnsMulticast: {
                value: true,
                required: false
            },
            mdnsInterface: {
                required: false
            },
            mdnsPort: {
                required: false
            },
            mdnsIp: {
                required: false
            },
            mdnsTtl: {
                required: false
            },
            mdnsLoopback: {
                value: true,
                required: false
            },
            mdnsReuseAddr: {
                value: true,
                required: false
            },
            allowMessagePassthrough: {
                value: true,
                required: true
            },
            logLevel: {
                value: 'inherit',
                required: false
            },
        },
        label: function () {
            return this.bridgeName || 'Bridge'
        },
        labelStyle: function () {
            return this.bridgeName ? 'node_label_italic' : ''
        },
        onadd: function () {
            applyDefaultNodeDocumentation(this, 'homekit-standalone')
        },
        oneditprepare: function () {
            const node = this
            appendNRCHKBLogLevelRow(
                '#node-config-input-logLevel-container',
                'node-config-input-logLevel',
                node.logLevel,
            )

            const prefersReducedMotion = function () {
                return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
            }
            const showEditorSection = function (section) {
                if (prefersReducedMotion()) {
                    section.stop(true, true).show()
                    return
                }

                section.stop(true, true).fadeIn('fast')
            }
            const hideEditorSection = function (section) {
                if (prefersReducedMotion()) {
                    section.stop(true, true).hide()
                    return
                }

                section.stop(true, true).fadeOut('fast')
            }

            if (!validatePinCode(node.pinCode)) {
                node.pinCode = generatePinCode()
                $('#node-config-input-pinCode').val(this.pinCode)
            }

            $('#node-config-input-allowMessagePassthrough').prop(
                'checked',
                node.allowMessagePassthrough,
            )

            let customMdnsConfigCheckbox = $(
                '#node-config-input-customMdnsConfig',
            )
            let mdnsConfiguration = $('#mdns-configuration')
            let mdnsConfigurationSection = mdnsConfiguration.closest('details')

            customMdnsConfigCheckbox
                .change(function () {
                    if (this.checked) {
                        mdnsConfigurationSection.prop('open', true)
                        showEditorSection(mdnsConfiguration)
                    } else {
                        hideEditorSection(mdnsConfiguration)
                    }
                })
                .change()

            const selectCategoryName = $('#node-config-input-accessoryCategory')

            Object.entries(accessoryCategories).forEach(([key, value]) => {
                selectCategoryName.append(
                    $('<option></option>')
                        .val(key)
                        .text(value)
                )
            })

            selectCategoryName
                .find('option')
                .filter(function () {
                    return $(this).val() === node.accessoryCategory
                })
                .attr('selected', 'true')

            $('#node-config-input-bind').typedInput({
                typeField: '#node-config-input-bindType',
                default: 'str',
                types: ['json', 'str']
            })

            applyAdvertiserRecommendation('#node-config-input-advertiser')

            if (RED.NRCHKBPairingQR) {
                RED.NRCHKBPairingQR.renderHostEditor(
                    node.id,
                    '#nrchkb-standalone-pairing-qr',
                )
            }
        },
    })
</script>
