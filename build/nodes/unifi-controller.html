<script data-template-name="homekit-unifi-controller" type="text/x-red">
    <div class="nrchkb-editor">
        <details class="nrchkb-section" open>
            <summary><i class="fa fa-server"></i> <span data-i18n="unifi-controller.unifi.title">UniFi Controller</span></summary>
            <div class="nrchkb-section-body">
                <div class="form-row">
                    <label for="node-config-input-name"><i class="fa fa-tag"></i> <span data-i18n="unifi-controller.common.name">Name</span></label>
                    <input type="text" id="node-config-input-name" placeholder="UniFi Protect" data-i18n="[placeholder]unifi-controller.unifi.namePlaceholder">
                </div>
                <div class="form-row">
                    <label for="node-config-input-application"><i class="fa fa-cubes"></i> <span data-i18n="unifi-controller.unifi.application">Application</span></label>
                    <select id="node-config-input-application">
                        <option value="protect" selected>Protect</option>
                    </select>
                </div>
                <div class="form-row">
                    <label for="node-config-input-address"><i class="fa fa-globe"></i> <span data-i18n="unifi-controller.unifi.address">Address</span></label>
                    <input type="text" id="node-config-input-address" placeholder="192.168.1.1" autocomplete="url" spellcheck="false">
                </div>
                <div class="form-row">
                    <label for="node-config-input-username"><i class="fa fa-user"></i> <span data-i18n="unifi-controller.unifi.username">Username</span></label>
                    <input type="text" id="node-config-input-username" autocomplete="username" spellcheck="false">
                </div>
                <div class="form-row">
                    <label for="node-config-input-password"><i class="fa fa-lock"></i> <span data-i18n="unifi-controller.unifi.password">Password</span></label>
                    <input type="password" id="node-config-input-password" autocomplete="current-password">
                </div>
                <div class="form-row">
                    <label for="node-config-input-overrideAddress"><i class="fa fa-random"></i> <span data-i18n="unifi-controller.unifi.overrideAddress">Override Address</span></label>
                    <input type="text" id="node-config-input-overrideAddress" placeholder="Optional livestream address" data-i18n="[placeholder]unifi-controller.unifi.overrideAddressPlaceholder" autocomplete="url" spellcheck="false">
                </div>
                <div class="form-row nrchkb-checkbox-row">
                    <label class="nrchkb-checkbox-label" for="node-config-input-allowSelfSigned">
                        <input type="checkbox" id="node-config-input-allowSelfSigned">
                        <span><i class="fa fa-shield"></i> <span data-i18n="unifi-controller.unifi.allowSelfSigned">Allow self-signed certificates</span></span>
                    </label>
                </div>
                <div id="node-config-input-logLevel-container"></div>
            </div>
        </details>
    </div>
</script>

<script data-help-name="homekit-unifi-controller" type="text/markdown">
# UniFi Controller

Stores connection details for UniFi application integrations. Protect is supported now; the generic node name leaves room for future Access or Network integrations.

> [!IMPORTANT]
> Use a dedicated local UniFi account with the minimum permissions needed to read Protect camera data.

> [!WARNING]
> Allow self-signed certificates only for controllers you administer and trust on your local network.
</script>

<script type="text/javascript">
    RED.nodes.registerType('homekit-unifi-controller', {
        category: 'config',
        defaults: {
            name: {
                value: '',
            },
            application: {
                value: 'protect',
                required: true,
            },
            address: {
                value: '',
                required: true,
            },
            allowSelfSigned: {
                value: false,
            },
            overrideAddress: {
                value: '',
            },
            logLevel: {
                value: 'inherit',
                required: false,
            },
        },
        credentials: {
            username: {
                type: 'text',
            },
            password: {
                type: 'password',
            },
        },
        label: function () {
            return this.name || this.address || nrchkbText('unifi.title', 'UniFi Controller')
        },
        onadd: function () {
            applyDefaultNodeDocumentation(this, 'homekit-unifi-controller')
        },
        oneditprepare: function () {
            appendNRCHKBLogLevelRow(
                '#node-config-input-logLevel-container',
                'node-config-input-logLevel',
                this.logLevel,
            )
        },
    })
</script>
